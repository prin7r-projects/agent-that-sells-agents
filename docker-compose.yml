services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-that-sells-agents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stampedagents
      POSTGRES_USER: stampedagents
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stampedagents_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stampedagents -d stampedagents"]
      interval: 10s
      timeout: 5s
      retries: 5

  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    container_name: agent-that-sells-agents-landing
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://stampedagents:${DB_PASSWORD:-stampedagents_dev}@postgres:5432/stampedagents
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent-that-sells-agents.rule=Host(`agent-that-sells-agents.prin7r.com`)"
      - "traefik.http.routers.agent-that-sells-agents.entrypoints=websecure"
      - "traefik.http.routers.agent-that-sells-agents.tls.certresolver=letsencrypt"
      - "traefik.http.services.agent-that-sells-agents.loadbalancer.server.port=3000"

volumes:
  pgdata:
