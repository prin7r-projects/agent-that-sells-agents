services:
  redis:
    image: redis:7-alpine
    container_name: agent-that-sells-agents-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: agent-that-sells-agents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stampedagents
      POSTGRES_USER: stampedagents
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stampedagents_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stampedagents -d stampedagents"]
      interval: 10s
      timeout: 5s
      retries: 5

  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    container_name: agent-that-sells-agents-landing
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://stampedagents:${DB_PASSWORD:-stampedagents_dev}@postgres:5432/stampedagents
      - REDIS_URL=redis://redis:6379
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # API routes — priority 20 (highest, matched first)
      - "traefik.http.routers.agent-that-sells-agents-api.rule=(Host(`agent-that-sells-agents.prin7r.com`) || Host(`stampedagents.prin7r-app.com`)) && PathPrefix(`/api/`)"
      - "traefik.http.routers.agent-that-sells-agents-api.entrypoints=websecure"
      - "traefik.http.routers.agent-that-sells-agents-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.agent-that-sells-agents-api.priority=20"
      - "traefik.http.services.agent-that-sells-agents-api.loadbalancer.server.port=3000"
      # App routes — priority 15
      - "traefik.http.routers.agent-that-sells-agents-app.rule=(Host(`agent-that-sells-agents.prin7r.com`) || Host(`stampedagents.prin7r-app.com`)) && (PathPrefix(`/app`) || PathPrefix(`/admin`) || PathPrefix(`/changelog`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.agent-that-sells-agents-app.entrypoints=websecure"
      - "traefik.http.routers.agent-that-sells-agents-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.agent-that-sells-agents-app.priority=15"
      - "traefik.http.services.agent-that-sells-agents-app.loadbalancer.server.port=3000"
      # Landing (default catch-all) — priority 1
      - "traefik.http.routers.agent-that-sells-agents.rule=Host(`agent-that-sells-agents.prin7r.com`) || Host(`stampedagents.prin7r-app.com`)"
      - "traefik.http.routers.agent-that-sells-agents.entrypoints=websecure"
      - "traefik.http.routers.agent-that-sells-agents.tls.certresolver=letsencrypt"
      - "traefik.http.routers.agent-that-sells-agents.priority=1"
      - "traefik.http.services.agent-that-sells-agents.loadbalancer.server.port=3000"

volumes:
  pgdata:
  redisdata:
